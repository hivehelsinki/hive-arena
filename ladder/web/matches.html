{{define "content"}}
<h1>Matches{{with .Filter.Team}} of {{.}}{{end}}{{with .Filter.Players}}, {{.}} players{{end}}</h1>
<form class="filter" method="get">
	<input name="team" placeholder="Team" value="{{.Filter.Team}}">
	<select name="players">
		<option value="">Any number of players</option>
		{{range .Formats}}<option value="{{.Players}}"{{if eq .Players $.Filter.Players}} selected{{end}}>{{.Players}} players</option>{{end}}
	</select>
	<button>Filter</button>
</form>
{{template "matchrows" .Matches}}
{{with .Next}}<p><a href="{{.}}">Older matches</a></p>{{end}}
{{end}}
